# ── Africa Immo Management — pile de production (VPS + Docker Compose) ───────────────────
#
#   cp .env.prod.example .env      # puis renseigner domaines / secrets / mots de passe
#   docker compose -f compose.prod.yml build
#   docker compose -f compose.prod.yml up -d
#
# Exposé sur l'hôte : uniquement Caddy (80/443). db et api ne sont joignables
# que sur les réseaux internes. Voir docs/DEPLOIEMENT.md pour le détail.

name: africa-immo

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_NAME:?}
      MYSQL_USER: ${DB_USER:?}
      MYSQL_PASSWORD: ${DB_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      # Origine(s) autorisée(s) en CORS = l'URL publique du front.
      CORS_ORIGIN: ${PUBLIC_APP_URL:?}
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: ${DB_USER:?}
      DB_PASSWORD: ${DB_PASSWORD:?}
      DB_NAME: ${DB_NAME:?}
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-10}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      JWT_ISSUER: ${JWT_ISSUER:-lyko-system}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      # URL publique du site : liens des courriels, des PDF et retour FedaPay.
      FRONTEND_URL: ${PUBLIC_APP_URL:?}
      # Secrets obligatoires en production (l'API refuse de démarrer sans eux).
      JWT_MARKETPLACE_ACCOUNT_SECRET: ${JWT_MARKETPLACE_ACCOUNT_SECRET:?}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:?}
      # Courriels (vérification d'inscription, relances d'abonnement).
      RESEND_API_KEY: ${RESEND_API_KEY:?}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:?}
      # Abonnements et facturation de la plateforme (compte FedaPay de la plateforme).
      SUBSCRIPTIONS_ENFORCED: ${SUBSCRIPTIONS_ENFORCED:-false}
      PLATFORM_FEDAPAY_SECRET_KEY: ${PLATFORM_FEDAPAY_SECRET_KEY:-}
      PLATFORM_FEDAPAY_WEBHOOK_SECRET: ${PLATFORM_FEDAPAY_WEBHOOK_SECRET:-}
      PLATFORM_FEDAPAY_SANDBOX: ${PLATFORM_FEDAPAY_SANDBOX:-true}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      PLATFORM_REFUND_FEE_PERCENT: ${PLATFORM_REFUND_FEE_PERCENT:-}
      PLATFORM_ADMIN_JWT_SECRET: ${PLATFORM_ADMIN_JWT_SECRET:-}
      PLATFORM_LEGAL_NAME: ${PLATFORM_LEGAL_NAME:-Africa Immo Management}
      PLATFORM_LEGAL_RCCM: ${PLATFORM_LEGAL_RCCM:-}
      PLATFORM_LEGAL_IFU: ${PLATFORM_LEGAL_IFU:-}
      PLATFORM_LEGAL_ADDRESS: ${PLATFORM_LEGAL_ADDRESS:-}
      TERMS_VERSION: ${TERMS_VERSION:-2026-10}
      ASSISTANT_FEATURE_ENABLED: ${ASSISTANT_FEATURE_ENABLED:-false}
    volumes:
      - uploads:/app/uploads
    networks:
      - backend
      - edge
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        # ⚠ Figée dans le bundle client AU BUILD — rebuild obligatoire si elle change.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?}
        NEXT_PUBLIC_CONTACT_WHATSAPP: ${NEXT_PUBLIC_CONTACT_WHATSAPP:-}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
        NEXT_PUBLIC_LEGAL_NAME: ${NEXT_PUBLIC_LEGAL_NAME:-}
        NEXT_PUBLIC_LEGAL_RCCM: ${NEXT_PUBLIC_LEGAL_RCCM:-}
        NEXT_PUBLIC_LEGAL_IFU: ${NEXT_PUBLIC_LEGAL_IFU:-}
        NEXT_PUBLIC_LEGAL_ADDRESS: ${NEXT_PUBLIC_LEGAL_ADDRESS:-}
        NEXT_PUBLIC_LEGAL_DIRECTOR: ${NEXT_PUBLIC_LEGAL_DIRECTOR:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Adresse secrète du back-office (lue au démarrage, pas de rebuild nécessaire). Vide = /admin.
      ADMIN_PATH: ${ADMIN_PATH:-}
    networks:
      - edge
    depends_on:
      api:
        condition: service_started

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?}
      API_DOMAIN: ${API_DOMAIN:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    depends_on:
      - web
      - api

networks:
  edge:
  backend:
    internal: true

volumes:
  db_data:
  uploads:
  caddy_data:
  caddy_config:
